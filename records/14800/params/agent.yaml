seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 30000
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - critic
  discriminator:
  - disc
  discriminator_demonstration:
  - disc_demo
clip_actions: null
check_for_nan: true
save_interval: 200
experiment_name: g1_assist_amp_rough
run_name: assist_8192_30k_pd_1ms
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: legged_lab.rsl_rl.amp.ppo_amp:PPOAMP
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: true
    data_augmentation_func: legged_lab.tasks.locomotion.amp.mdp.symmetry.g1:compute_symmetric_states
    mirror_loss_coeff: 0.1
  amp_cfg:
    disc_obs_buffer_size: 1000
    grad_penalty_scale: 40.0
    disc_trunk_weight_decay: 0.0001
    disc_linear_weight_decay: 0.1
    disc_learning_rate: 1.0e-05
    disc_max_grad_norm: 1.0
    disc_update_interval: 10
    amp_discriminator:
      hidden_dims:
      - 1024
      - 512
      activation: elu
      style_reward_scale: 2.0
      task_style_lerp: 0.5
    loss_type: LSGAN
policy: {}
